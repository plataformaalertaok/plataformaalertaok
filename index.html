<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALERT - Panel de administración</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161922;
    --border: #262b38;
    --text: #e6e8ee;
    --text-muted: #8b91a3;
    --accent: #d64545;
    --accent-dark: #a83636;
    --ok: #3fa876;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .center-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 32px;
    width: 100%;
    max-width: 380px;
  }
  .card h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  .card p.sub {
    color: var(--text-muted);
    font-size: 13px;
    margin: 0 0 24px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  input[type="text"], input[type="password"], input[type="tel"] {
    width: 100%;
    padding: 10px 12px;
    background: #0f1115;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
    margin-bottom: 16px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%;
    padding: 11px;
    background: var(--accent);
    border: none;
    border-radius: 6px;
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error-msg {
    color: var(--accent);
    font-size: 13px;
    margin: -8px 0 16px;
  }
  #app { display: none; padding: 24px; max-width: 960px; margin: 0 auto; }
  header.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  header.top h1 { font-size: 18px; margin: 0; }
  .btn-logout {
    width: auto;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 6px 14px;
    font-weight: 400;
    font-size: 13px;
  }
  .btn-logout:hover { background: var(--panel); }
  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  section h2 { font-size: 15px; margin: 0 0 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-muted); font-weight: 500; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 12px;
  }
  .badge.choque { background: rgba(214,69,69,0.15); color: #e07777; }
  .badge.vuelco { background: rgba(214,150,69,0.15); color: #e0a877; }
  .phones-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .phones-grid input { margin-bottom: 0; }
  .save-status { font-size: 13px; color: var(--ok); margin-top: 8px; height: 18px; }
  .empty { color: var(--text-muted); font-size: 13px; padding: 16px 0; text-align: center; }
</style>
</head>
<body>

<div id="login-screen" class="center-screen">
  <div class="card">
    <h1>ALERT</h1>
    <p class="sub">Panel de administración del sistema de detección de accidentes</p>
    <form id="login-form">
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <p class="error-msg" id="login-error" style="display:none"></p>
      <button type="submit" id="login-btn">Ingresar</button>
    </form>
  </div>
</div>

<div id="app">
  <header class="top">
    <h1>ALERT — Panel de administración</h1>
    <button class="btn-logout" onclick="cerrarSesion()">Cerrar sesión</button>
  </header>

  <section>
    <h2>Teléfonos a alertar (máximo 5)</h2>
    <div class="phones-grid" id="phones-grid"></div>
    <button style="width:auto;padding:8px 20px;" onclick="guardarTelefonos()">Guardar cambios</button>
    <div class="save-status" id="save-status"></div>
  </section>

  <section>
    <h2>Historial de alertas</h2>
    <div id="alertas-container"><p class="empty">Cargando...</p></div>
  </section>
</div>

<script>
  // -----------------------------------------------------------------------
  // CONFIGURACIÓN: reemplazar con la URL de tu implementación de Apps Script
  // (Implementar > Nueva implementación > Aplicación web > copiar "URL de la app web")
  // -----------------------------------------------------------------------
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/TU_ID_DE_DESPLIEGUE/exec';

  let sessionToken = null;

  document.getElementById('login-form').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    const usuario = document.getElementById('usuario').value.trim();
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('login-error');
    const btn = document.getElementById('login-btn');

    errorEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Verificando...';

    try {
      const url = APPS_SCRIPT_URL + '?action=login&usuario=' + encodeURIComponent(usuario) + '&password=' + encodeURIComponent(password);
      const res = await fetch(url);
      const data = await res.json();

      if (data.ok) {
        sessionToken = data.token;
        sessionStorage.setItem('alert_token', data.token);
        mostrarApp();
      } else {
        errorEl.textContent = 'Usuario o contraseña incorrectos.';
        errorEl.style.display = 'block';
      }
    } catch (err) {
      errorEl.textContent = 'No se pudo conectar con el servidor.';
      errorEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Ingresar';
    }
  });

  function mostrarApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    cargarTelefonos();
    cargarAlertas();
  }

  function cerrarSesion() {
    sessionToken = null;
    sessionStorage.removeItem('alert_token');
    document.getElementById('app').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('password').value = '';
  }

  async function cargarTelefonos() {
    const grid = document.getElementById('phones-grid');
    grid.innerHTML = '';
    try {
      const res = await fetch(APPS_SCRIPT_URL + '?action=config');
      const data = await res.json();
      const telefonos = data.ok ? data.telefonos : [];
      for (let i = 0; i < 5; i++) {
        const input = document.createElement('input');
        input.type = 'tel';
        input.placeholder = 'Teléfono ' + (i + 1);
        input.value = telefonos[i] || '';
        input.id = 'tel-' + i;
        grid.appendChild(input);
      }
    } catch (err) {
      grid.innerHTML = '<p class="empty">No se pudieron cargar los teléfonos.</p>';
    }
  }

  async function guardarTelefonos() {
    const status = document.getElementById('save-status');
    const telefonos = [];
    for (let i = 0; i < 5; i++) {
      const val = document.getElementById('tel-' + i).value.trim();
      if (val) telefonos.push(val);
    }
    status.textContent = 'Guardando...';
    status.style.color = 'var(--text-muted)';
    try {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'actualizar_telefonos', token: sessionToken, telefonos: telefonos })
      });
      const data = await res.json();
      if (data.ok) {
        status.textContent = 'Guardado. El ESP32 tomará el cambio en su próximo arranque.';
        status.style.color = 'var(--ok)';
      } else {
        status.textContent = 'Error: sesión inválida, volvé a iniciar sesión.';
        status.style.color = 'var(--accent)';
      }
    } catch (err) {
      status.textContent = 'No se pudo guardar.';
      status.style.color = 'var(--accent)';
    }
  }

  async function cargarAlertas() {
    const container = document.getElementById('alertas-container');
    try {
      const res = await fetch(APPS_SCRIPT_URL + '?action=alertas');
      const data = await res.json();
      const alertas = data.ok ? data.alertas : [];

      if (!alertas.length) {
        container.innerHTML = '<p class="empty">Todavía no se registraron alertas.</p>';
        return;
      }

      let html = '<table><thead><tr><th>Fecha</th><th>Hora</th><th>Tipo</th><th>Nivel</th><th>Ubicación</th><th>Velocidad</th><th>Dispositivo</th></tr></thead><tbody>';
      alertas.forEach(function (a) {
        const badgeClass = a.tipo === 'choque' ? 'choque' : 'vuelco';
        const mapsLink = 'https://maps.google.com/?q=' + a.latitud + ',' + a.longitud;
        html += '<tr>' +
          '<td>' + a.fecha + '</td>' +
          '<td>' + a.hora + '</td>' +
          '<td><span class="badge ' + badgeClass + '">' + a.tipo + '</span></td>' +
          '<td>' + a.nivel + '</td>' +
          '<td><a href="' + mapsLink + '" target="_blank" style="color:var(--text-muted)">' + a.latitud + ', ' + a.longitud + '</a></td>' +
          '<td>' + (a.velocidad || '-') + '</td>' +
          '<td>' + (a.device_id || '-') + '</td>' +
          '</tr>';
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    } catch (err) {
      container.innerHTML = '<p class="empty">No se pudo cargar el historial.</p>';
    }
  }

  // Recuperar sesión si ya estaba logueado (misma pestaña)
  (function () {
    const saved = sessionStorage.getItem('alert_token');
    if (saved) {
      sessionToken = saved;
      mostrarApp();
    }
  })();
</script>
</body>
</html>
